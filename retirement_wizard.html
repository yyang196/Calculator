<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBFBF9">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-title" content="退休规划">
<title>退休规划计算器</title>
<meta name="description" content="3 分钟算一算：退休那天需要准备多少钱，从今天起每月需要投资多少。">
<meta property="og:title" content="退休规划计算器">
<meta property="og:description" content="3 分钟算一算：退休那天需要准备多少钱，从今天起每月需要投资多少。">
<style>
:root{
  --paper:#FBFBF9; --ink:#1F2A33; --ink-2:#4A5560; --ink-3:#6B7580; --line:#DCDFDB; --mist:#F1F3EF;
  --acc:#2F7D6B; --acc-soft:#DCEDE7; --wait:#7C8B96; --wait-soft:#E6EAED;
  --post:#D9603F; --post-ink:#A8432A; --post-soft:#F8E1D8;
  --cp:#2F6E8A; --wa:#1FA855;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#E4E7E2;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:16px}
.app{max-width:480px;min-height:100vh;margin:0 auto;background:var(--paper);position:relative}
button{font-family:inherit}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 20px 6px;padding-top:max(14px,env(safe-area-inset-top))}
.bar-row{display:flex;align-items:center;justify-content:space-between;min-height:34px}
.back{font-size:16px;color:var(--ink-2);background:none;border:0;padding:6px 0;cursor:pointer}
.back[hidden]{display:block;visibility:hidden}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;font-size:13px;overflow:hidden}
.lang button{border:0;background:none;padding:5px 11px;cursor:pointer;color:var(--ink-2);font-size:13px}
.lang button.on{background:var(--ink);color:#fff}
.prog{display:flex;gap:6px;align-items:center;margin-top:8px}
.prog button{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--acc);background:var(--acc);padding:0;cursor:pointer;color:#fff;font-size:11px}
.prog button.cur{background:#fff;color:var(--acc);font-weight:700;width:30px;height:30px;font-size:13px}
.prog button.todo{background:none;border-color:var(--line);color:var(--ink-3);cursor:default}
.prog .txt{margin-left:auto;font-size:13px;color:var(--ink-3);white-space:nowrap}
.prog button{flex:none}
/* narrow phones: shrink the dots instead of letting flex squash them into ovals */
@media (max-width:400px){
  .prog{gap:5px}
  .prog button{width:22px;height:22px}
  .prog button.cur{width:28px;height:28px}
}
@media (max-width:350px){
  .prog{gap:3px}
  .prog button{width:20px;height:20px;font-size:10px}
  .prog button.cur{width:26px;height:26px;font-size:12px}
  .prog .txt{font-size:12px}
}

/* steps */
.step{display:none;padding:22px 20px 200px}
.step.on{display:block}
.step.long{padding-bottom:0}
.kicker{font-size:14px;color:var(--acc);font-weight:600;margin:0 0 8px}
.q{font-size:25px;line-height:1.4;font-weight:600;margin:0 0 8px}
.qsub{font-size:16px;line-height:1.7;color:var(--ink-2);margin:0 0 24px}
.help{font-size:14px;line-height:1.7;color:var(--ink-3);margin:14px 0 0}

/* choice cards */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:1.5px solid var(--line);border-radius:18px;padding:22px 16px;text-align:center;cursor:pointer;background:#fff;font-size:20px;font-weight:600;color:var(--ink)}
.choice.sel{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}

/* big number + range */
.num{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0 18px}
.num .v{font-size:56px;font-weight:600;font-variant-numeric:tabular-nums;min-width:110px;text-align:center;line-height:1}
.num .v small{font-size:18px;font-weight:500;color:var(--ink-3);margin-left:4px}
.pm{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:24px;color:var(--ink);cursor:pointer;line-height:1}
input[type=range]{width:100%;accent-color:var(--acc);height:28px;margin:0}
.range-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-top:2px}

/* money input */
.inp{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding:6px 0;margin-top:6px}
.inp span{font-size:18px;color:var(--ink-2)}
.inp input{border:0;background:none;font:600 30px var(--sans);flex:1;min-width:0;color:var(--ink);font-variant-numeric:tabular-nums;outline:none;padding:0}
.lbl{font-size:14px;color:var(--ink-3)}

/* tiers / presets */
.tier{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;padding:16px 4px;border-top:1px solid var(--line);cursor:pointer}
.tier:last-of-type{border-bottom:1px solid var(--line)}
.tier .dot{justify-self:center;border-radius:50%;background:var(--line)}
.tier.sel .dot{background:var(--acc)}
.tier .nm{font-size:18px;font-weight:600}.tier .ds{font-size:14px;color:var(--ink-3);margin-top:2px}
.tier .amt{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.tier .amt small{font-size:13px;color:var(--ink-3);font-weight:400}
.tier.sel .nm,.tier.sel .amt{color:var(--acc)}
.own{margin-top:24px}

.adv{margin-top:22px;border-top:1px solid var(--line);padding-top:6px}
.adv summary{font-size:16px;font-weight:600;padding:12px 0;cursor:pointer;color:var(--ink-2);list-style:none}
.adv summary::-webkit-details-marker{display:none}
.adv summary::after{content:"＋";float:right;color:var(--ink-3)}
.adv[open] summary::after{content:"－"}
.slider{margin:6px 0 18px}
.slider .top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--ink-2)}
.slider .top b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.slider .s{font-size:13px;color:var(--ink-3);margin-top:2px;line-height:1.6}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;font-size:15px;color:var(--ink-2)}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:14px;background:var(--line);cursor:pointer;transition:.2s}
.sw i::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{transform:translateX(20px)}

/* merged age step */
.q2{margin-top:34px;font-size:23px}
/* life calendar */
.cal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}
.cal-stats div{border-radius:14px;background:var(--mist);padding:12px 10px}
.cal-stats b{display:block;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;color:#6F7880}
.cal-stats span{font-size:13px;color:var(--ink-2);line-height:1.45;display:block;margin-top:4px}
.cal-stats .prep b{color:var(--acc)}.cal-stats .ret b{color:var(--post-ink)}
.cal{display:grid;grid-template-columns:24px repeat(10,1fr);gap:5px;align-items:center}
.cal .dec{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cal i,.cal-key i{display:block;aspect-ratio:1;border-radius:4px}
.c-lived{background:#9AA2A9}
.c-now{background:var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.c-prep{border:1.5px solid var(--acc);background:#fff}
.c-ret{background:var(--post-soft);border:1.5px solid #EDB8A6}
.c-start{background:var(--post);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--post)}
.c-none{visibility:hidden}
.cal-key{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:18px;font-size:14px;color:var(--ink-2)}
.cal-key span{display:flex;align-items:center;gap:7px}
.cal-key i{width:14px;height:14px;flex:none}
/* cashflow table */
.cf table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;margin-top:6px}
.cf th{font-size:12.5px;font-weight:500;color:var(--ink-3);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.cf td{text-align:right;padding:7px 4px;border-bottom:1px solid #EEF0EC;color:var(--ink)}
.cf th:first-child,.cf td:first-child{text-align:left;width:40px;color:var(--ink-2)}
.cf td:nth-child(2){color:var(--acc)}
.cf tr.post td:nth-child(3),.cf tr.ret td:nth-child(3){color:var(--post-ink)}
.cf tr.ret td{background:var(--post-soft);font-weight:600}
.cf-head{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin:6px 2px 4px}
.cf-head .out{color:var(--post-ink);font-weight:600}.cf-head .in{color:var(--acc);font-weight:600}
.key i.sq{width:10px;height:10px;border-radius:2px;vertical-align:-1px}
.cf-tot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cf-tot div{background:var(--mist);border-radius:12px;padding:10px 12px}
.cf-tot span{display:block;font-size:13px;color:var(--ink-3)}
.cf-tot b{font-size:18px;font-variant-numeric:tabular-nums}
.cf-tot b.in{color:var(--acc)}.cf-tot b.out{color:var(--post-ink)}
.cf table{margin-top:10px}
.more{display:block;width:100%;margin-top:10px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink-2);font-size:15px;cursor:pointer}
.cap9{margin:4px 0 22px}
.cap9 .help a{color:var(--acc);font-weight:600;cursor:pointer}
/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none}
.foot-in{max-width:480px;margin:0 auto;padding:18px 20px;padding-bottom:max(22px,env(safe-area-inset-bottom));background:linear-gradient(rgba(251,251,249,0),var(--paper) 16px);pointer-events:auto}
/* short screens (e.g. 320×568): keep the fixed footer compact so content isn't buried */
@media (max-height:700px){
  .foot-in{padding-top:16px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .foot .quote{font-size:15px;line-height:1.55;margin-bottom:10px}
  .cta{height:50px}
}
.foot[hidden]{display:none}
.quote{font-size:17px;line-height:1.7;color:var(--ink);font-weight:500;padding-left:14px;border-left:3px solid var(--acc);margin:0 0 16px}
.cta{width:100%;height:56px;border:0;border-radius:16px;background:var(--ink);color:#fff;font:600 18px var(--sans);cursor:pointer}
.cta:disabled{background:#B9BFC4;cursor:default}
.cta2{width:100%;height:44px;border:0;background:none;color:var(--ink-2);font-size:15px;cursor:pointer;margin-top:4px}

/* result */
.r-q{font-size:24px;line-height:1.45;font-weight:600;margin:0}
.r-q em{font-style:normal;color:var(--acc);font-variant-numeric:tabular-nums}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:14px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--ink-2);cursor:pointer;background:#fff}
.chip u{text-decoration:none;color:var(--acc);margin-left:6px}
.card{margin-top:22px;padding:18px 14px 12px;border:1px solid var(--line);border-radius:18px;background:#fff}
.card h3{font-size:17px;margin:0 4px 2px;font-weight:600}
.card .u{font-size:13px;color:var(--ink-3);margin:0 4px 6px}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-2);margin:8px 4px 0}
.key i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.key i.dash{height:0;border-top:2px dashed var(--ink-3);background:none}
svg text{font-family:var(--sans)}
svg text.halo{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:16px 0;border-top:1px solid var(--line);align-items:baseline}
.kvs{margin-top:22px}
.kv .k{font-size:16px;color:var(--ink-2)}
.kv .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.kv .s{grid-column:1/-1;font-size:14px;color:var(--ink-3);line-height:1.6}
.kv.hero .v{font-size:30px;color:var(--acc)}
.kv.big .v{font-size:26px}
.kv.gap .v{color:var(--post-ink)}
.assume{margin-top:6px;padding:14px 16px;background:var(--mist);border-radius:14px;font-size:14px;line-height:1.7;color:var(--ink-2)}
.assume b{color:var(--ink)}
.assume a{color:var(--acc);cursor:pointer;text-decoration:none;font-weight:600}
.delay{margin-top:24px;padding:18px 16px;border-radius:18px;background:var(--post-soft)}
.delay h3{font-size:17px;margin:0 0 4px}
.delay p{font-size:14px;color:var(--ink-2);margin:0 0 12px;line-height:1.6}
.dl{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;font-size:15px;padding:7px 0}
.dl .b{height:10px;border-radius:5px;background:var(--post)}
.dl .b.now{background:var(--acc)}
.dl .v{font-weight:600;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.delay .fn{font-size:13px;color:var(--ink-3);margin:8px 0 0}
.close{margin:28px 0 0}
.next-card{margin-top:24px}

/* strategies */
.strat-ctrl{margin-top:4px}
.strats{display:grid;gap:12px;margin-top:8px}
.strat{border-radius:18px;padding:16px;border:1.5px solid var(--line);background:#fff}
.strat.cp{border-color:var(--cp)}.strat.cd{border-color:var(--post)}
.strat .tag{font-size:13px;font-weight:600}
.strat.cp .tag{color:var(--cp)}.strat.cd .tag{color:var(--post-ink)}
.strat h3{font-size:19px;margin:2px 0 4px}
.strat p{font-size:14px;line-height:1.65;color:var(--ink-2);margin:0 0 6px}
.sr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.sr .k{font-size:15px;color:var(--ink-2)}.sr .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.sr .s{grid-column:1/-1;font-size:13px;color:var(--ink-3);line-height:1.55}

/* contact + legal */
.contact{margin-top:24px;padding:20px 18px;border-radius:20px;background:var(--ink);color:#fff}
.who{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:#3A4853;object-fit:cover;flex:none}
.who .nm{font-size:18px;font-weight:600}.who .tt{font-size:14px;opacity:.8;margin-top:2px}
.wa{display:flex;align-items:center;justify-content:center;width:100%;height:54px;margin-top:16px;border-radius:14px;background:var(--wa);color:#fff;font:600 17px var(--sans);text-decoration:none}
.ct{display:flex;align-items:center;gap:12px;min-height:44px;color:#fff;font-size:16px;text-decoration:none;word-break:break-all}
.ct:first-of-type{margin-top:12px}
.ct svg{width:20px;height:20px;flex:none;opacity:.85}
.wxtip{font-size:13px;line-height:1.6;opacity:.8;margin:10px 0 0}
.wx{display:flex;gap:14px;align-items:center;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.15)}
.wx img{width:96px;height:96px;border-radius:8px;background:#fff;padding:4px;flex:none}
.wx p{margin:0;font-size:14px;line-height:1.6;opacity:.9}
.qrsave{margin-top:10px;height:36px;padding:0 16px;border:1px solid rgba(255,255,255,.4);border-radius:10px;background:none;color:#fff;font:500 14px var(--sans)}
.legal{padding:22px 0 calc(30px + env(safe-area-inset-bottom));font-size:13px;line-height:1.7;color:var(--ink-3)}
.legal .verb{margin-top:12px;color:var(--ink-2)}
.legal a{color:var(--ink-2)}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="bar-row">
      <button class="back" id="btnBack"></button>
      <div class="lang"><button data-lang="zh">中</button><button data-lang="en">EN</button></div>
    </div>
    <div class="prog" id="prog"></div>
  </header>
  <main id="steps"></main>
</div>
<div class="foot" id="foot"><div class="foot-in">
  <p class="quote" id="quote"></p>
  <button class="cta" id="cta"></button>
  <button class="cta2" id="cta2" hidden></button>
</div></div>

<script>
// ============ STATE ============
const state = {
  gender: null,
  ageNow: 40,
  ageRetire: 65,
  yearsRetired: 20,  // gender-driven default: M=20, F=25
  existingSavings: 100000,
  monthlyExpenseToday: 2900,
  rPre: 6.0,
  iPre: 2.5,
  waitingEnabled: false,
  yearsWait: 5,
  rPost: 4.0,
  iPost: 2.5,
  yieldCp: 4.0,
  withdrawalCd: 4.0,
  capital9: null,  // page 9 capital; null = use LS from page 8
};
const ui = { lang: 'zh', step: 1, maxReached: 1, returnTo: null };
const STEPS = 9;
const PRESETS = {
  low:  { rPre: 4.0, rPost: 3.0, iPre: 2.5, iPost: 2.5 },
  mid:  { rPre: 6.0, rPost: 4.0, iPre: 2.5, iPost: 2.5 },
  high: { rPre: 8.0, rPost: 5.0, iPre: 2.5, iPost: 2.5 },
};
const WA_NUMBER = '6581236667';

// Per-viewer convenience only; page works without it
const STORE_KEY = 'retirement-wizard-v1';
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved) { Object.assign(state, saved.state || {}); Object.assign(ui, saved.ui || {}); ui.returnTo = null; }
} catch (e) {}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ state, ui: { lang: ui.lang, maxReached: ui.maxReached } })); } catch (e) {}
}

// ============ HELPERS ============
const fmtMoney = (n, dp = 0) => {
  if (!isFinite(n)) return '—';
  return Math.round(n).toLocaleString('en-SG', { maximumFractionDigits: dp });
};
const parseMoney = (s) => Number(String(s).replace(/[^0-9.-]/g, '')) || 0;
const fmtPct = (n, dp = 1) => `${n.toFixed(dp)}%`;
const S = (n) => 'S$' + fmtMoney(n);
const t = (zh, en) => ui.lang === 'zh' ? zh : en;
const $ = (id) => document.getElementById(id);

// ============ CALCULATION (verbatim from retirement_v2.html) ============
function calculate() {
  const s = state;
  const yearsPre = Math.max(0, s.ageRetire - s.ageNow);
  // Waiting period sits BEFORE retirement (within pre-retirement span); no contributions during this time.
  const yearsWait = s.waitingEnabled ? Math.max(0, Math.min(yearsPre, s.yearsWait)) : 0;
  const yearsContribution = Math.max(0, yearsPre - yearsWait);
  const ageContributionEnd = s.ageNow + yearsContribution;
  const N = Math.max(1, s.yearsRetired);
  const ageDecum = s.ageRetire;            // decumulation begins AT retirement (waiting ends here)
  const ageEnd = s.ageRetire + N;

  const iPre = s.iPre / 100, iPost = s.iPost / 100;
  const rPre = s.rPre / 100, rPost = s.rPost / 100;
  // Waiting period is part of pre-retirement — uses the same return + inflation as Phase I.
  const rWait = rPre;
  const iWait = iPre;

  // ① Future monthly expense at retirement (= start of decumulation)
  // Entire pre-retirement period (contribution + waiting) inflates at iPre.
  const monthlyAtRetire = s.monthlyExpenseToday * Math.pow(1 + iPre, yearsPre);
  const annualAtRetire = monthlyAtRetire * 12;
  // Aliases kept for downstream code expecting old names
  const monthlyAtDecum = monthlyAtRetire;
  const annualAtDecum = annualAtRetire;

  // ② Lump sum needed at retirement — BGN mode (growing annuity due, B_N = 0)
  // First withdrawal occurs AT retirement; the (1 + rPost) factor converts ordinary annuity → annuity due.
  let LS;
  if (Math.abs(rPost - iPost) < 1e-9) {
    LS = annualAtRetire * N;
  } else {
    const q = (1 + iPost) / (1 + rPost);
    LS = annualAtRetire * (1 + rPost) * (1 - Math.pow(q, N)) / (rPost - iPost);
  }

  // ③ Monthly savings required — TVM BGN mode (annuity due)
  // Existing savings deposited at T=0; first monthly contribution at start of month 1; last at start of month M.
  // Each contribution earns one extra month of compounding vs END mode.
  const ESAtContribEnd = s.existingSavings * Math.pow(1 + rPre, yearsContribution);
  const ESAtRet = ESAtContribEnd * Math.pow(1 + rWait, yearsWait);
  const ESProjectedAtDecum = ESAtRet;
  const shortfall = Math.max(0, LS - ESAtRet);
  const shortfallAtDecum = shortfall;
  let monthlySavings = 0;
  if (shortfall > 0 && yearsContribution > 0) {
    const targetAtContribEnd = shortfall / Math.pow(1 + rWait, yearsWait);
    const mPre = Math.pow(1 + rPre, 1 / 12) - 1;
    const M = yearsContribution * 12;
    // Annuity due (BGN) factor: ((1+m)^M − 1)/m × (1+m)
    const annuityFactor = mPre > 0
      ? ((Math.pow(1 + mPre, M) - 1) / mPre) * (1 + mPre)
      : M;
    monthlySavings = targetAtContribEnd / annuityFactor;
  }

  // ④ Capital Preservation
  const yieldCp = s.yieldCp / 100;
  const annualIncomeCP = LS * yieldCp;
  const monthlyIncomeCP = annualIncomeCP / 12;
  const realIncomeCPEnd = annualIncomeCP / Math.pow(1 + iPost, N);

  // ⑤ Capital Drawdown trajectory (with floating-point tolerance for depletion)
  const wRate = s.withdrawalCd / 100;
  const W1 = LS * wRate;
  const cdBalance = [];   // length N, padded with 0 after depletion
  const cdWithdraw = [];  // length N
  const EPS = Math.max(W1 * 0.001, 1);  // 0.1% of W1 — treats sub-tolerance balances as depleted
  let bal = LS;
  let depletionYear = null;  // first year within plan when balance reaches ≤ EPS
  for (let t = 1; t <= N; t++) {
    const Wt = W1 * Math.pow(1 + iPost, t - 1);
    cdWithdraw.push(Wt);
    if (depletionYear !== null) { cdBalance.push(0); continue; }
    const newBal = (bal - Wt) * (1 + rPost);
    if (newBal <= EPS) { depletionYear = t; cdBalance.push(0); }
    else { bal = newBal; cdBalance.push(bal); }
  }
  // If never depleted within plan, project forward to find eventual depletion (for note)
  let depletionYearEventual = depletionYear;
  if (depletionYearEventual === null) {
    let bal2 = bal;
    for (let t = N + 1; t <= N + 100; t++) {
      const Wt = W1 * Math.pow(1 + iPost, t - 1);
      bal2 = (bal2 - Wt) * (1 + rPost);
      if (bal2 <= EPS) { depletionYearEventual = t; break; }
    }
  }
  const monthlyIncomeCDStart = W1 / 12;
  const finalYearForFinalIncome = depletionYear ? Math.min(N, depletionYear) : N;
  const finalAnnualIncomeCD = W1 * Math.pow(1 + iPost, finalYearForFinalIncome - 1);
  const monthlyIncomeCDFinal = finalAnnualIncomeCD / 12;
  const finalBalAtN = cdBalance[N - 1] || 0;

  // Full asset timeline (PLANNED path — independent of Chapter 3 CD strategy)
  const timeline = []; // {age, balance, phase}
  let b = s.existingSavings;
  timeline.push({ age: s.ageNow, balance: b, phase: 'pre' });
  const mPreRate = Math.pow(1 + rPre, 1 / 12) - 1;
  // Contribution phase — BGN mode (add first, grow second)
  for (let yr = 1; yr <= yearsContribution; yr++) {
    for (let m = 0; m < 12; m++) {
      b = (b + monthlySavings) * (1 + mPreRate);
    }
    timeline.push({ age: s.ageNow + yr, balance: b, phase: 'pre' });
  }
  // Waiting phase (still before retirement, no contributions)
  for (let yr = 1; yr <= yearsWait; yr++) {
    b = b * (1 + rWait);
    timeline.push({ age: ageContributionEnd + yr, balance: b, phase: 'wait' });
  }
  // Decumulation — uses PLANNED expense (cost of living), not Chapter 3 CD strategy.
  // Capital reaches exactly 0 at end of year N by construction of LS.
  for (let yr = 1; yr <= N; yr++) {
    const Et = annualAtRetire * Math.pow(1 + iPost, yr - 1);
    b = (b - Et) * (1 + rPost);
    timeline.push({ age: ageDecum + yr, balance: Math.max(0, b), phase: 'post' });
  }

  // Cashflow (annual, by age) — contributions BGN mode, decumulation BGN mode. Expenses use PLANNED cost-of-living, NOT Chapter 3 CD strategy.
  // At T=0 (age = ageNow), the one-time deposit AND the first BGN monthly contribution both occur; subsequent years aggregate that year's 12 monthly contributions.
  const cashflow = { labels: [], oneTime: [], recurring: [], expense: [] };
  for (let age = s.ageNow; age <= ageEnd; age++) {
    cashflow.labels.push(age);
    let one = 0, rec = 0, exp = 0;
    if (age === s.ageNow) {
      one = s.existingSavings;
    }
    // BGN mode contributions: yearsContribution years (ages ageNow..ageContributionEnd−1). Each cell aggregates the 12 monthly BGN-mode contributions made during that year.
    if (age >= s.ageNow && age < ageContributionEnd) {
      rec = monthlySavings * 12;
    }
    // BGN mode decumulation: N years starting AT ageRetire (ages ageRetire..ageRetire+N−1). First withdrawal happens AT retirement.
    if (age >= s.ageRetire && age < s.ageRetire + N) {
      const yr = age - s.ageRetire + 1;
      exp = -annualAtRetire * Math.pow(1 + iPost, yr - 1);
    }
    cashflow.oneTime.push(one);
    cashflow.recurring.push(rec);
    cashflow.expense.push(exp);
  }

  return {
    yearsPre, yearsWait, yearsContribution, ageContributionEnd, N, ageDecum, ageEnd,
    monthlyAtDecum, annualAtDecum, monthlyAtRetire, annualAtRetire, LS,
    monthlySavings, shortfall, shortfallAtDecum, ESAtRet, ESAtContribEnd, ESProjectedAtDecum,
    annualIncomeCP, monthlyIncomeCP, realIncomeCPEnd,
    W1, monthlyIncomeCDStart, monthlyIncomeCDFinal, finalYearForFinalIncome,
    depletionYear, depletionYearEventual, finalBalAtN, cdBalance, cdWithdraw,
    timeline, cashflow
  };
}

// Cost of delay: same shortfall, contributions start `d` years later (existing savings still compound from today)
function monthlyIfDelayed(r, d) {
  const years = r.yearsContribution - d;
  if (r.shortfall <= 0 || years < 1) return null;
  const rPre = state.rPre / 100;
  const target = r.shortfall / Math.pow(1 + rPre, r.yearsWait);
  const m = Math.pow(1 + rPre, 1 / 12) - 1;
  const M = years * 12;
  return target / (m > 0 ? ((Math.pow(1 + m, M) - 1) / m) * (1 + m) : M);
}

// Page 9: steps ④⑤ of calculate() applied to a capital the client enters (defaults to LS)
function strategyFor(capital, N) {
  const s = state;
  const iPost = s.iPost / 100, rPost = s.rPost / 100;
  const annualIncomeCP = capital * (s.yieldCp / 100);
  const monthlyIncomeCP = annualIncomeCP / 12;
  const realIncomeCPEnd = annualIncomeCP / Math.pow(1 + iPost, N);
  const W1 = capital * (s.withdrawalCd / 100);
  const cdBalance = [], cdWithdraw = [];
  const EPS = Math.max(W1 * 0.001, 1);
  let bal = capital, depletionYear = null;
  for (let t = 1; t <= N; t++) {
    const Wt = W1 * Math.pow(1 + iPost, t - 1);
    cdWithdraw.push(Wt);
    if (depletionYear !== null) { cdBalance.push(0); continue; }
    const newBal = (bal - Wt) * (1 + rPost);
    if (newBal <= EPS) { depletionYear = t; cdBalance.push(0); }
    else { bal = newBal; cdBalance.push(bal); }
  }
  const finalYearForFinalIncome = depletionYear ? Math.min(N, depletionYear) : N;
  return {
    capital, annualIncomeCP, monthlyIncomeCP, realIncomeCPEnd,
    monthlyIncomeCDStart: W1 / 12,
    monthlyIncomeCDFinal: W1 * Math.pow(1 + iPost, finalYearForFinalIncome - 1) / 12,
    finalYearForFinalIncome, depletionYear, finalBalAtN: cdBalance[N - 1] || 0, cdBalance, cdWithdraw
  };
}

// ============ WIRING ============
function wire() {
  document.querySelectorAll('[data-gender]').forEach(el => el.onclick = () => {
    state.gender = el.dataset.gender;
    // Switching gender overwrites any manual yearsRetired (SG life expectancy convention)
    state.yearsRetired = state.gender === 'M' ? 20 : 25;
    update();
  });
  document.querySelectorAll('input[type=range]').forEach(el => el.oninput = () => {
    state[el.dataset.key] = Number(el.value);
    update();
  });
  document.querySelectorAll('[data-pm]').forEach(el => el.onclick = () => {
    const r = $('r_' + el.dataset.pm);
    const v = Math.min(Number(r.max), Math.max(Number(r.min), state[el.dataset.pm] + Number(el.dataset.d)));
    state[el.dataset.pm] = v; update();
  });
  const money = (id, key) => {
    const el = $(id);
    el.oninput = () => {
      state[key] = parseMoney(el.value);
      el.value = state[key] ? fmtMoney(state[key]) : '';
      update();
    };
  };
  money('inSavings', 'existingSavings');
  money('inMonthly', 'monthlyExpenseToday');
  document.querySelectorAll('[data-tier]').forEach(el => el.onclick = () => { state.monthlyExpenseToday = Number(el.dataset.tier); update(); });
  document.querySelectorAll('[data-preset]').forEach(el => el.onclick = () => { Object.assign(state, PRESETS[el.dataset.preset]); update(); });
  $('inWait').onchange = (e) => { state.waitingEnabled = e.target.checked; update(); };
  $('inCapital').oninput = (e) => {
    const v = parseMoney(e.target.value);
    state.capital9 = e.target.value.trim() === '' ? null : v;
    if (state.capital9 !== null) e.target.value = fmtMoney(v);
    update();
  };
  $('cfAll').onclick = () => { ui.cfAll = !ui.cfAll; update(); };
  document.querySelectorAll('[data-go]').forEach(el => el.onclick = () => go(Number(el.dataset.go)));
  document.querySelectorAll('[data-qrsave]').forEach(el => el.onclick = saveQR);
}

// ============ NAVIGATION ============
// Every step change is a history entry, so the phone's back button / gesture steps back instead of closing the page.
function go(n, push = true) {
  n = Math.max(1, Math.min(STEPS, n));
  if (n > ui.maxReached) ui.maxReached = n;
  if (n >= 8) ui.returnTo = null;
  ui.step = n;
  if (push) history.pushState({ step: n }, '', '#' + n);
  show();
  window.scrollTo(0, 0);
}
function edit(n) { ui.returnTo = ui.step; go(n); }
window.addEventListener('popstate', (e) => {
  const n = (e.state && e.state.step) || Number(location.hash.slice(1)) || 1;
  go(Math.min(n, ui.maxReached), false);
});
$('btnBack').onclick = () => go(ui.step - 1);
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { ui.lang = b.dataset.lang; build(); });

function canContinue() {
  if (ui.step === 1) return !!state.gender;
  if (ui.step === 6) return state.monthlyExpenseToday > 0;
  return true;
}
function show() {
  document.querySelectorAll('.step').forEach(s => s.classList.toggle('on', Number(s.dataset.step) === ui.step));
  const back = $('btnBack');
  back.textContent = t('‹ 上一步', '‹ Back');
  back.hidden = ui.step === 1;
  // progress dots
  const p = $('prog'); p.innerHTML = '';
  for (let k = 1; k <= STEPS; k++) {
    const b = document.createElement('button');
    b.textContent = k;
    b.title = t(STEP_NAMES[k][0], STEP_NAMES[k][1]);
    if (k === ui.step) b.className = 'cur';
    else if (k > ui.maxReached) b.className = 'todo';
    if (k <= ui.maxReached && k !== ui.step) b.onclick = () => go(k);
    p.appendChild(b);
  }
  const tx = document.createElement('span'); tx.className = 'txt';
  tx.textContent = t(`第 ${ui.step} / ${STEPS} 步`, `Step ${ui.step} of ${STEPS}`);
  p.appendChild(tx);
  // footer (steps 1–7 only)
  const foot = $('foot'); foot.hidden = ui.step >= 8;
  if (ui.step < 8) {
    $('quote').innerHTML = QUOTES[ui.step][ui.lang === 'zh' ? 0 : 1];
    const cta = $('cta'), cta2 = $('cta2');
    if (ui.returnTo) {
      cta.textContent = t('完成，回到结果', 'Done, back to results');
      cta.onclick = () => go(ui.returnTo);
      cta2.hidden = false; cta2.textContent = t('继续下一步', 'Continue to next step');
      cta2.onclick = () => go(ui.step + 1);
    } else {
      cta.textContent = ui.step === 7 ? t('查看结果', 'See my results') : t('下一步', 'Next');
      cta.onclick = () => go(ui.step + 1);
      cta2.hidden = true;
    }
  }
  update();
}

// ============ RENDER ============
function setRange(key, val, min) {
  const r = $('r_' + key); if (!r) return;
  if (min !== undefined) { r.min = min; const m = $('min_' + key); if (m) m.textContent = min; }
  r.value = val;
  const v = $('v_' + key);
  if (v) v.textContent = r.dataset.pct ? (key === 'yearsWait' ? val + t(' 年', ' yrs') : fmtPct(val)) : val;
}

function update() {
  // keep ages consistent: retirement at least one year after today
  if (state.ageRetire <= state.ageNow) state.ageRetire = state.ageNow + 1;
  if (state.ageRetire > 80) state.ageRetire = 80;
  const r = calculate();
  const L = ui.lang === 'zh';

  document.querySelectorAll('[data-gender]').forEach(el => el.classList.toggle('sel', el.dataset.gender === state.gender));
  setRange('ageNow', state.ageNow);
  setRange('ageRetire', state.ageRetire, state.ageNow + 1);
  setRange('yearsRetired', state.yearsRetired);
  ['rPre', 'iPre', 'rPost', 'iPost', 'yearsWait', 'yieldCp', 'withdrawalCd'].forEach(k => setRange(k, state[k]));
  $('subRetire').textContent = t(`距离退休还有 ${r.yearsPre} 年。`, `${r.yearsPre} years from now.`);
  drawCalendar(r);
  $('subYears').textContent = t(`也就是从 ${state.ageRetire} 岁规划到 ${r.ageEnd} 岁。`, `That is, planning from age ${state.ageRetire} to ${r.ageEnd}.`);
  const sv = $('inSavings'); if (document.activeElement !== sv) sv.value = fmtMoney(state.existingSavings);
  const mv = $('inMonthly'); if (document.activeElement !== mv) mv.value = state.monthlyExpenseToday ? fmtMoney(state.monthlyExpenseToday) : '';
  document.querySelectorAll('[data-tier]').forEach(el => el.classList.toggle('sel', Number(el.dataset.tier) === state.monthlyExpenseToday));
  let presetHit = false;
  document.querySelectorAll('[data-preset]').forEach(el => {
    const p = PRESETS[el.dataset.preset];
    const on = Object.keys(p).every(k => p[k] === state[k]);
    presetHit = presetHit || on;
    el.classList.toggle('sel', on);
  });
  if (!presetHit && ui.step === 7) $('adv').open = true;
  $('inWait').checked = state.waitingEnabled;
  $('waitBox').style.display = state.waitingEnabled ? 'block' : 'none';
  $('r_yearsWait').max = Math.max(1, Math.min(20, r.yearsPre - 1));

  const cta = $('cta'); if (ui.step < 8) cta.disabled = !canContinue();

  renderResult(r, L);
  renderStrategies(r, L);
  const msg = t(
    `您好，我用了退休规划工具：今年 ${state.ageNow} 岁，计划 ${state.ageRetire} 岁退休。目标资本 ${S(r.LS)}，` + (r.monthlySavings > 0 ? `每月需投资 ${S(r.monthlySavings)}。` : `现有储蓄预计已足够。`) + `想进一步了解。`,
    `Hi, I used the retirement planner: I am ${state.ageNow} and plan to retire at ${state.ageRetire}. Target capital ${S(r.LS)}, ` + (r.monthlySavings > 0 ? `monthly investment needed ${S(r.monthlySavings)}. ` : `my current savings look sufficient. `) + `I would like to learn more.`);
  document.querySelectorAll('[data-wa]').forEach(a => a.href = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`);
  save();
}

      enough ? t('已超过所需资本', 'More than the capital needed') : t(`占所需资本约 ${Math.round(pct)}%`, `About ${Math.round(pct)}% of the capital needed`)) +

      : kv('gap', t('还差', 'Shortfall'), S(r.shortfall), t('由每月投资来补足', 'To be covered by monthly investment'))) +
    (enough
      ? kv('hero', t('今起每月投资', 'Monthly investment from today'), 'S$0', t('现有储蓄按假设增长，预计已足够覆盖目标。', 'At the assumed return, your existing savings are expected to cover the target.'))
      : kv('hero', t('今起每月投资', 'Monthly investment from today'), S(r.monthlySavings),

  }
  drawMain(r);

// Butterfly bar chart on a vertical age axis: one series grows left, the other right, same scale both sides.
// rows: [{ age, left: [[value, colour], ...], right: [...] }] (stacked outward); labels: [[rowIndex, 'L' | 'R'], ...]
function butterfly(svgId, rows, markAge, labels, extra) {
  const n = rows.length;
  const W = chartW(), mid = W / 2, gap = 19, side = mid - gap - 2;
  const rowH = Math.max(7, Math.min(13, 460 / n)), barH = Math.max(4, rowH - 2.5);
  const top = Math.max(6, 12 + 2 - barH);  // first-row labels need a full line of room above the bars
  let H = top + n * rowH + 6;
  const sum = (a) => a.reduce((acc, [v]) => acc + v, 0);
  const max = Math.max(1, ...rows.map(x => Math.max(sum(x.left), sum(x.right))));
  // leave room outside the longest bar for the widest value label
  const room = Math.max(50, ...labels.map(([k, lr]) => textW(fmtMoney(sum(lr === 'R' ? rows[k].right : rows[k].left))) + 8));
  const w = v => v / max * (side - room);
  const yOf = k => top + k * rowH;
  let s = '';
  rows.forEach((x, k) => {
    const y = yOf(k);
    const isMark = x.age === markAge;
    if (isMark) s += `<line x1="0" x2="${W}" y1="${y - 1.2}" y2="${y - 1.2}" stroke="#D9603F" stroke-width="1" stroke-dasharray="3 3"/>`;
    let xl = mid - gap;
    x.left.forEach(([v, c]) => { if (v) { xl -= w(v); s += `<rect x="${xl}" y="${y}" width="${w(v)}" height="${barH}" rx="1.5" fill="${c}"/>`; } });
    let xr = mid + gap;
    x.right.forEach(([v, c]) => { if (v) { s += `<rect x="${xr}" y="${y}" width="${w(v)}" height="${barH}" rx="1.5" fill="${c}"/>`; xr += w(v); } });
    const nearMark = markAge != null && !isMark && k !== 0 && Math.abs(x.age - markAge) < 3;
    if ((k === 0 || k === n - 1 || isMark || (x.age - rows[0].age) % 5 === 0) && !nearMark)
      s += `<text x="${mid}" y="${y + barH - 0.5}" font-size="${isMark ? 13 : 12}" font-weight="${isMark ? 700 : 400}" text-anchor="middle" fill="${isMark ? '#A8432A' : '#6B7580'}">${x.age}</text>`;
  });
  const lastY = { L: -Infinity, R: -Infinity };  // adjacent rows are closer than the 12px font: push later labels down
  labels.forEach(([k, lr]) => {
    const x = rows[k], y = Math.max(yOf(k) + barH - 0.5, lastY[lr] + 13);
    lastY[lr] = y;
    if (lr === 'R') { const v = sum(x.right); s += `<text class="halo" x="${mid + gap + w(v) + 4}" y="${y}" font-size="12" font-weight="600" fill="#1F2A33">${fmtMoney(v)}</text>`; }
    else { const v = sum(x.left); s += `<text class="halo" x="${mid - gap - w(v) - 4}" y="${y}" font-size="12" font-weight="600" text-anchor="end" fill="#1F2A33">${fmtMoney(v)}</text>`; }
  });
  // extra returns { s, bottom } so a wrapped note below the last row still fits inside the chart
  if (extra) { const e = extra(yOf, barH, mid, gap, lastY, W); s += e.s; H = Math.max(H, e.bottom + 6); }
  const svg = $(svgId); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = s;
}

// Page 8: investments left, expenses right
function renderCashflow(r) {
  const cf = r.cashflow, tl = r.timeline;
  const last = r.ageEnd - 1;  // final cashflow year; its year-end balance is timeline at ageEnd
  const rows = [];
  cf.labels.forEach((age, i) => { if (age <= last) rows.push({ age, i, one: cf.oneTime[i], rec: cf.recurring[i], out: -cf.expense[i] }); });
  const n = rows.length;
  const kIn = rows.findIndex(x => x.one + x.rec > 0), kOut0 = rows.findIndex(x => x.out > 0);
  const labels = [];
  if (kIn >= 0) labels.push([kIn, 'L']);
  if (kIn >= 0 && rows[kIn + 1] && rows[kIn + 1].rec) labels.push([kIn + 1, 'L']);
  if (kOut0 >= 0) labels.push([kOut0, 'R'], [n - 1, 'R']);
  butterfly('cfChart', rows.map(x => ({ age: x.age, left: [[x.one, '#1F5E50'], [x.rec, '#2F7D6B']], right: [[x.out, '#D9603F']] })), state.ageRetire, labels);

  let totIn = 0, totOut = 0, body = '';
  rows.forEach(x => {
    totIn += x.one + x.rec; totOut += x.out;
    const cls = x.age === state.ageRetire ? 'ret' : x.age < state.ageRetire ? '' : 'post';
    body += `<tr class="${cls}"><td>${x.age}</td><td>${x.one + x.rec ? fmtMoney(x.one + x.rec) : '–'}</td><td>${x.out ? fmtMoney(x.out) : '–'}</td><td>${fmtMoney(tl[x.i + 1].balance)}</td></tr>`;
  });
  $('cfTot').innerHTML = `<div><span>${t('总投入', 'Total in')}</span><b class="in">${S(totIn)}</b></div><div><span>${t('总开支', 'Total out')}</span><b class="out">${S(totOut)}</b></div>` +
    (totOut > totIn ? `<p class="help" style="grid-column:1/-1;margin:2px 0 0">${t(`两者相差 ${S(totOut - totIn)}，来自投资回报（按假设计算，并非保证）。`, `The difference of ${S(totOut - totIn)} comes from investment returns (at the assumed rates; not guaranteed).`)}</p>` : '');
  $('cfBody').innerHTML = body;
  $('cfTable').style.display = ui.cfAll ? 'table' : 'none';
  $('cfAll').textContent = ui.cfAll ? t('收起逐年数字', 'Hide yearly figures') : t('查看逐年数字', 'Show yearly figures');
}

// ============ LIFE CALENDAR ============
// One square per year of life, age 0 to the end of the plan; rows are decades.
function drawCalendar(r) {
  const now = state.ageNow, ret = state.ageRetire, end = r.ageEnd;
  let h = '';
  for (let dec = 0; dec < end; dec += 10) {
    h += `<span class="dec">${dec}</span>`;
    for (let a = dec; a < dec + 10; a++) {
      let c;
      if (a >= end) c = 'c-none';
      else if (a < now) c = 'c-lived';
      else if (a === now) c = 'c-now';
      else if (a < ret) c = 'c-prep';
      else if (a === ret) c = 'c-start';
      else c = 'c-ret';
      h += `<i class="${c}" title="${a}"></i>`;
    }
  }
  $('cal').innerHTML = h;
  $('subCal').textContent = t(`一格代表一年，从出生到 ${end} 岁。`, `Each square is one year, from birth to age ${end}.`);
  const st = (n, zh, en, cls) => `<div class="${cls}"><b>${n}</b><span>${t(zh, en)}</span></div>`;
  $('calStats').innerHTML =
    st(now, '年已经走过', 'years lived', '') +
    st(ret - now, '年可以准备', 'years to prepare', 'prep') +
    st(r.N, `年退休生活（${ret} 岁起）`, `years of retirement (from ${ret})`, 'ret');
}

// ============ CHARTS (inline SVG, no library) ============
// Approximate width of 12px chart text: CJK glyphs are full-width, Latin/digits about 0.58em
const textW = (str) => [...str].reduce((w, c) => w + (c.charCodeAt(0) > 255 ? 12 : 7), 0);
// Greedy line break to a pixel width: keep phrases whole (split after ；，; ,), else break English at spaces, Chinese between characters
function wrapText(str, maxW) {
  const zh = /[一-鿿]/.test(str);
  const phrases = str.split(zh ? /(?<=[，；])/ : /(?<=[;,]) /);
  const tokens = phrases.flatMap(p => textW(p) <= maxW ? [p] : zh ? [...p] : p.split(' '));
  const lines = [];
  let cur = '';
  tokens.forEach(tk => {
    const next = cur ? cur + (zh ? '' : ' ') + tk : tk;
    if (cur && textW(next) > maxW) { lines.push(cur); cur = tk; } else cur = next;
  });
  if (cur) lines.push(cur);
  return lines;
}
// Chart width in CSS px = column width − step padding (2×20) − card padding/border (2×15)
const chartW = () => Math.max(240, Math.min(480, window.innerWidth) - 70);
const fmtAxis = (v) => v >= 1e6 ? (v / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M' : v >= 1e3 ? Math.round(v / 1e3) + 'K' : String(Math.round(v));
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}
// Left margin for the y-axis: the widest tick label (e.g. "2.25M") plus its 6px gap and a 2px edge
const axisRoom = (max) => Math.max(...[0, .25, .5, .75, 1].map(f => textW(fmtAxis(max * f)))) + 8;
function frame(W, H, x0, n, max) {
  const X = i => x0 + i * (W - x0 - 8) / Math.max(1, n - 1);
  const Y = v => 14 + (H - 14) * (1 - v / max);
  let s = '';
  [0, .25, .5, .75, 1].forEach(f => {
    const v = max * f;
    s += `<line x1="${x0}" x2="${W - 8}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E6E8E4"/><text x="${x0 - 6}" y="${Y(v) + 4}" font-size="12" text-anchor="end" fill="#6B7580">${fmtAxis(v)}</text>`;
  });
  return { X, Y, s };
}
const pathOf = (pts, X, Y) => pts.map(([i, v], k) => (k ? ' L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join('');

function drawMain(r) {
  const W = chartW(), H = 180;
  const tl = r.timeline, n = tl.length;
  const rPre = state.rPre / 100;
  const iRet = r.yearsPre;  // index of retirement in timeline
  const es = []; for (let i = 0; i <= iRet; i++) es.push([i, state.existingSavings * Math.pow(1 + rPre, i)]);
  const max = niceMax(Math.max(...tl.map(x => x.balance), ...es.map(x => x[1])) * 1.05);
  const x0 = Math.max(40, axisRoom(max));
  const { X, Y, s: grid } = frame(W, H, x0, n, max);
  let s = grid;
  const seg = (a, b, line, fill) => {
    if (b <= a) return;
    const pts = []; for (let i = a; i <= b; i++) pts.push([i, tl[i].balance]);
    const d = pathOf(pts, X, Y);
    s += `<path d="${d} L${X(b)},${Y(0)} L${X(a)},${Y(0)}Z" fill="${fill}"/><path d="${d}" fill="none" stroke="${line}" stroke-width="2.5"/>`;
  };
  const iCon = r.yearsContribution;
  seg(0, iCon, '#2F7D6B', '#DCEDE7');
  seg(iCon, iRet, '#7C8B96', '#E6EAED');
  seg(iRet, n - 1, '#D9603F', '#F8E1D8');
  if (r.shortfall > 0) s += `<path d="${pathOf(es, X, Y)}" fill="none" stroke="#6B7580" stroke-width="1.6" stroke-dasharray="4 4"/>`;
  const peak = tl[iRet].balance, xr = X(iRet);
  const room = W - 8 - xr, roomRight = room > 78;
  const anchor = roomRight ? 'start' : 'end', dx = roomRight ? 6 : -8;
  s += `<circle cx="${xr}" cy="${Y(peak)}" r="5" fill="#fff" stroke="#1F2A33" stroke-width="2"/>`;
  // peak label: left of the dot if it clears the y-axis labels, else right if it fits, else clamp inside the chart
  const peakTxt = `${t(`${state.ageRetire} 岁`, `Age ${state.ageRetire}`)} ${S(peak)}`;
  const pw = textW(peakTxt);
  const px = xr - 8 - pw >= x0 - 2 ? xr - 8 - pw : xr + 8 + pw <= W - 2 ? xr + 8 : Math.max(x0, W - 2 - pw);
  s += `<text class="halo" x="${px}" y="${Y(peak) - 8}" font-size="12" font-weight="600" fill="#1F2A33">${peakTxt}</text>`;
  if (r.shortfall > 0) {
    const esEnd = r.ESAtRet;
    s += `<circle cx="${xr}" cy="${Y(esEnd)}" r="3.5" fill="#6B7580"/>`;
    s += `<line x1="${xr - 7}" x2="${xr - 7}" y1="${Y(peak) + 10}" y2="${Y(esEnd) - 6}" stroke="#D9603F" stroke-width="1.4"/>`;
    // savings-only label sits under its dot, but no lower than the x-axis label row allows
    const esY = Math.min(Y(esEnd) + 4, H - 11);
    const midY = Math.min(Y((peak + esEnd) / 2), esY - 38);
    const arrow = room > 104 ? '← ' : '';
    s += `<text class="halo" x="${xr + dx}" y="${midY}" font-size="12" font-weight="600" text-anchor="${anchor}" fill="#A8432A">${arrow}${t('还差', 'Shortfall')}</text><text class="halo" x="${xr + dx}" y="${midY + 16}" font-size="12" font-weight="600" text-anchor="${anchor}" fill="#A8432A">${S(r.shortfall)}</text>`;
    s += `<text class="halo" x="${xr + dx}" y="${esY}" font-size="12" text-anchor="${anchor}" fill="#4A5560">${arrow}${t('只靠现有储蓄', 'Savings only')}</text><text class="halo" x="${xr + dx}" y="${esY + 16}" font-size="12" text-anchor="${anchor}" fill="#4A5560">${S(esEnd)}</text>`;
  }
  // x labels: today, retirement, end (skip if crowded)
  const labs = [[0, t(`${state.ageNow} 岁`, `Age ${state.ageNow}`), 'start'], [iRet, String(state.ageRetire), 'middle'], [n - 1, String(r.ageEnd), 'end']];
  labs.forEach(([i, txt, a], k) => {
    if (k === 1 && (iRet < 5 || n - 1 - iRet < 4)) return;
    s += `<text x="${X(i)}" y="${H + 20}" font-size="12" text-anchor="${a}" fill="#4A5560">${txt}</text>`;
  });
  $('chartMain').setAttribute('viewBox', `0 0 ${W} ${H + 30}`);
  $('chartMain').innerHTML = s;
  $('chartUnit').textContent = t(`单位：新元，${state.ageNow} 岁至 ${r.ageEnd} 岁`, `S$, age ${state.ageNow} to ${r.ageEnd}`);
  $('keyMain').innerHTML =
    `<span><i style="background:var(--acc)"></i>${r.monthlySavings > 0 ? t('按计划每月投资', 'Investing monthly') : t('现有储蓄增长', 'Existing savings growing')}</span>` +
    (r.yearsWait > 0 ? `<span><i style="background:var(--wait)"></i>${t('停止投资，继续增长', 'No new investment')}</span>` : '') +
    `<span><i style="background:var(--post)"></i>${t('退休后提取', 'Drawing in retirement')}</span>` +
    (r.shortfall > 0 ? `<span><i class="dash"></i>${t('只靠现有储蓄', 'Existing savings only')}</span>` : '');
}

function drawTwo(id, a, b, endLabel, n = state.yearsRetired) {
  // a, b: arrays of [yearIndex, value]; b may stop early (depleted); n = number of x points
  const W = chartW(), H = 170;
  const max = niceMax(Math.max(...a.map(x => x[1]), ...b.map(x => x[1]), 1) * 1.08);
  const x0 = Math.max(40, axisRoom(max));
  const { X, Y, s: grid } = frame(W, H, x0, n, max);
  let s = grid;
  s += `<path d="${pathOf(a, X, Y)}" fill="none" stroke="#2F6E8A" stroke-width="2.4"/>`;
  s += `<path d="${pathOf(b, X, Y)}" fill="none" stroke="#D9603F" stroke-width="2.4"/>`;
  if (endLabel) s += endLabel(X, Y);
  $(id).setAttribute('viewBox', `0 0 ${W} ${H + 30}`);
  s += `<text x="${X(0)}" y="${H + 20}" font-size="12" fill="#4A5560">${t(`${state.ageRetire} 岁`, `Age ${state.ageRetire}`)}</text>`;
  s += `<text x="${X(n - 1)}" y="${H + 20}" font-size="12" text-anchor="end" fill="#4A5560">${state.ageRetire + n - 1}</text>`;
  $(id).innerHTML = s;
}

function renderStrategies(r0) {
  const N = r0.N;
  const r = Object.assign({}, r0, strategyFor(state.capital9 ?? r0.LS, N));
  $('sub9').textContent = t(
    `从 ${state.ageRetire} 岁开始提领，规划 ${N} 年（到 ${r.ageEnd} 岁）。比较两种常见的提领方式，拖动滑杆看看差别。这一页不影响上一页的结果。`,
    `Withdrawals start at age ${state.ageRetire} and are planned for ${N} years (to age ${r.ageEnd}). Compare two common ways to draw on the capital; drag the sliders to see the difference. This page does not change the previous results.`);
  const ci = $('inCapital'); if (document.activeElement !== ci) ci.value = fmtMoney(r.capital);
  $('capNote').innerHTML = state.capital9 === null
    ? t('默认使用上一页算出的所需资本。如果您已经有一笔资金，可以直接改成实际金额。', 'This defaults to the capital calculated on the previous page. If you already have a sum set aside, enter the actual amount.')
    : t(`已改为您填写的金额。<a id="capReset">恢复为上一页的结果 ${S(r0.LS)}</a>`, `Using the amount you entered. <a id="capReset">Reset to the previous result, ${S(r0.LS)}</a>`);
  const rs = $('capReset'); if (rs) rs.onclick = () => { state.capital9 = null; update(); };
  let cdNote;
  if (r.depletionYear) {
    const age = state.ageRetire + r.depletionYear;
    cdNote = r.depletionYear === N
      ? t(`本金约在 ${age} 岁用完，正好撑到计划结束。`, `Capital runs out around age ${age}, just at the end of the plan.`)
      : t(`本金约在 ${age} 岁用完，比计划早 ${N - r.depletionYear} 年。`, `Capital runs out around age ${age}, ${N - r.depletionYear} years before the plan ends.`);
  } else {
    cdNote = t(`到 ${r.ageEnd} 岁仍剩约 ${S(r.finalBalAtN)}。`, `About ${S(r.finalBalAtN)} is left at age ${r.ageEnd}.`);
  }
  const sr = (k, v, s) => `<div class="sr"><span class="k">${k}</span><span class="v">${v}</span>${s ? `<span class="s">${s}</span>` : ''}</div>`;
  $('strats').innerHTML =
    `<div class="strat cp"><div class="tag">${t('策略 A', 'Strategy A')}</div><h3>${t('本金保全', 'Preserve capital')}</h3>
      <p>${t('只用每年的收益，本金一直保留，可以留给下一代；但收入固定不变，购买力会被通胀慢慢侵蚀。', 'Spend only the yield and keep the capital intact for the next generation. Income stays fixed, so inflation slowly erodes its buying power.')}</p>
      ${sr(t('每月收入（固定）', 'Monthly income (fixed)'), S(r.monthlyIncomeCP))}
      ${sr(t(`到 ${r.ageEnd} 岁，相当于今天的`, `By age ${r.ageEnd}, worth in today’s money`), '≈ ' + S(r.realIncomeCPEnd / 12), t(`按每年 ${fmtPct(state.iPost)} 通胀折算`, `At ${fmtPct(state.iPost)} yearly inflation`))}
      ${sr(t('结束时本金', 'Capital at the end'), S(r.capital), t('完整保留', 'Fully preserved'))}</div>
    <div class="strat cd"><div class="tag">${t('策略 B', 'Strategy B')}</div><h3>${t('逐步提取', 'Draw down')}</h3>
      <p>${t('每年提取的金额随通胀增加，保持购买力；本金会逐渐用完。', 'Withdrawals rise with inflation to keep buying power. The capital is gradually used up.')}</p>
      ${sr(t('第一年每月收入', 'Monthly income, year 1'), S(r.monthlyIncomeCDStart))}
      ${sr(t(`第 ${r.finalYearForFinalIncome} 年每月收入`, `Monthly income, year ${r.finalYearForFinalIncome}`), S(r.monthlyIncomeCDFinal), t(`每年按 ${fmtPct(state.iPost)} 增加`, `Rising ${fmtPct(state.iPost)} a year`))}
      ${sr(t('本金', 'Capital'), r.depletionYear ? t('用完', 'Used up') : S(r.finalBalAtN), cdNote)}</div>`;

  // income: B stops once capital is depleted
  const lastB = r.depletionYear ? r.depletionYear : N;
  const early = r.depletionYear && r.depletionYear < N;
  const incRows = [...Array(N)].map((_, i) => ({
    age: state.ageRetire + i,
    left: [[r.monthlyIncomeCP, '#2F6E8A']],
    right: i < lastB ? [[r.cdWithdraw[i] / 12, '#D9603F']] : [],
  }));
  const incLabels = [[0, 'L'], [0, 'R'], [N - 1, 'L']];
  if (lastB - 1 > 0) incLabels.push([lastB - 1, 'R']);
  butterfly('chartIncome', incRows, early ? state.ageRetire + lastB : null, incLabels,
    early ? (yOf, barH, mid, gap, lastY, W) => {
      // wrap to the right half so the note stays beside the depletion line on narrow screens
      const x = mid + gap + 4, y0 = Math.max(yOf(lastB) + barH - 0.5, lastY.R + 13);
      const lines = wrapText(t('本金用完，此后没有收入', 'Capital used up; no further income'), W - x - 4);
      return {
        s: lines.map((ln, i) => `<text x="${x}" y="${y0 + i * 15}" font-size="12" font-weight="600" fill="#A8432A">${ln}</text>`).join(''),
        bottom: y0 + (lines.length - 1) * 15 + 4,
      };
    } : null);
  // capital: LS at retirement, then end-of-year balances, so the last point is the balance at ageEnd
  const balA = [...Array(N + 1)].map((_, i) => [i, r.capital]);
  const balB = [...Array(N + 1)].map((_, i) => [i, i === 0 ? r.capital : r.cdBalance[i - 1]]);
  drawTwo('chartBal', balA, balB, null, N + 1);
}
